<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — EduApply</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="dash-nav">
    <div class="brand"><span class="brand-mark">EA</span><span class="brand-name">EduApply</span></div>
    <div class="nav-user">
      <span id="user-name" class="nav-username"></span>
      <button class="btn btn-ghost" id="logout-btn">Sign Out</button>
    </div>
  </nav>

  <main class="dash-main">
    <header class="dash-header reveal">
      <h1>Admin <em>Console</em></h1>
      <p>Approve new accounts and review submitted applications.</p>
    </header>

    <div class="tabs reveal">
      <button class="tab-btn active" data-tab="users">Account Requests</button>
      <button class="tab-btn" data-tab="apps">Applications</button>
    </div>

    <!-- Users -->
    <section id="tab-users" class="card reveal">
      <h2 class="card-title">Pending Account Requests</h2>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Role</th><th>Email</th><th>Phone</th>
              <th>Dept / Batch</th><th>Advisor</th><th>ID Card</th><th>Status</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Applications -->
    <section id="tab-apps" class="card hidden reveal">
      <h2 class="card-title">Submitted Applications</h2>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>#</th><th>Student</th><th>ID</th><th>Dept</th>
              <th>Type</th><th>Institution</th><th>Status</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="apps-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Review modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <h3 class="modal-title">Review Application</h3>
      <div id="review-meta" class="review-meta"></div>
      <div id="modal-body" class="letter-preview modal-letter"></div>
      <div class="field" id="feedback-wrap" style="margin-top:16px">
        <label>Feedback (required if rejecting)</label>
        <textarea id="feedback" rows="3" placeholder="Explain why the application is rejected…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="reject-btn">Reject</button>
        <button class="btn btn-success" id="approve-btn">Approve</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
