<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard — EduApply</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="dash-nav">
    <div class="brand"><span class="brand-mark">EA</span><span class="brand-name">EduApply</span></div>
    <div class="nav-user">
      <span id="user-name" class="nav-username"></span>
      <button class="btn btn-ghost" id="logout-btn">Sign Out</button>
    </div>
  </nav>

  <main class="dash-main">
    <header class="dash-header reveal">
      <h1>Hello, <em id="greet-name">Student</em></h1>
      <p>Submit a new application or track the ones you have sent.</p>
    </header>

    <div class="dash-grid">
      <!-- New application -->
      <section class="card reveal">
        <h2 class="card-title">New Application</h2>
        <form id="app-form" class="form">
          <div class="field">
            <label>Application Type</label>
            <select name="template_id" id="template-select" required>
              <option value="">Loading templates…</option>
            </select>
          </div>
          <div id="optional-fields"></div>
          <div class="grid-2">
            <div class="field">
              <label>Date *</label>
              <input type="date" name="letter_date" required />
            </div>
            <div class="field">
              <label>Principal / Dean Name *</label>
              <input type="text" name="authority_name" placeholder="e.g. Prof. Dr. A. Rahman" required />
            </div>
          </div>
          <div class="field">
            <label>Institution Name *</label>
            <input type="text" name="institution_name" placeholder="e.g. Dhaka University" required />
          </div>
          <div class="form-msg" id="app-msg"></div>
          <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
      </section>

      <!-- Preview -->
      <section class="card reveal">
        <h2 class="card-title">Letter Preview</h2>
        <div id="letter-preview" class="letter-preview">
          <p class="muted">Select a template and fill the fields to preview your letter.</p>
        </div>
      </section>

      <!-- My applications -->
      <section class="card span-full reveal">
        <h2 class="card-title">My Applications</h2>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>#</th><th>Type</th><th>Institution</th><th>Date</th><th>Status</th><th>Feedback</th><th></th></tr>
            </thead>
            <tbody id="apps-tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <h3 id="modal-title" class="modal-title"></h3>
      <div id="modal-body" class="letter-preview modal-letter"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
